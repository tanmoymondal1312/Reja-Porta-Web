<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="95" fill="#fff3e0" stroke="#e65100" stroke-width="4"/>
  <!-- Wheat/grain stalk center -->
  <g transform="translate(100,35)" fill="none" stroke="#e65100" stroke-width="4" stroke-linecap="round">
    <path d="M0 130 Q0 80 0 10" stroke-width="5"/>
    <!-- Grains left -->
    <ellipse cx="-4" cy="20" rx="10" ry="16" fill="#e65100" opacity="0.85" transform="rotate(-25,-4,20)"/>
    <ellipse cx="-4" cy="45" rx="10" ry="16" fill="#e65100" opacity="0.85" transform="rotate(-25,-4,45)"/>
    <ellipse cx="-4" cy="70" rx="9" ry="14" fill="#e65100" opacity="0.85" transform="rotate(-25,-4,70)"/>
    <ellipse cx="-4" cy="93" rx="8" ry="12" fill="#e65100" opacity="0.85" transform="rotate(-25,-4,93)"/>
    <!-- Grains right -->
    <ellipse cx="4" cy="20" rx="10" ry="16" fill="#e65100" opacity="0.85" transform="rotate(25,4,20)"/>
    <ellipse cx="4" cy="45" rx="10" ry="16" fill="#e65100" opacity="0.85" transform="rotate(25,4,45)"/>
    <ellipse cx="4" cy="70" rx="9" ry="14" fill="#e65100" opacity="0.85" transform="rotate(25,4,70)"/>
    <ellipse cx="4" cy="93" rx="8" ry="12" fill="#e65100" opacity="0.85" transform="rotate(25,4,93)"/>
    <!-- Top grain -->
    <ellipse cx="0" cy="5" rx="6" ry="10" fill="#e65100" opacity="0.85"/>
  </g>
</svg>
