<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb8c00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- Wheat/grain stalk left -->
  <g transform="translate(55,45) scale(0.7)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M30 140 Q30 80 30 30"/>
    <ellipse cx="30" cy="35" rx="8" ry="14" fill="#fff" stroke="none" transform="rotate(-20,30,35)"/>
    <ellipse cx="30" cy="55" rx="8" ry="14" fill="#fff" stroke="none" transform="rotate(20,30,55)"/>
    <ellipse cx="30" cy="75" rx="8" ry="14" fill="#fff" stroke="none" transform="rotate(-20,30,75)"/>
    <ellipse cx="30" cy="95" rx="7" ry="12" fill="#fff" stroke="none" transform="rotate(20,30,95)"/>
  </g>
  <!-- Wheat/grain stalk right -->
  <g transform="translate(105,45) scale(0.7)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M30 140 Q30 80 30 30"/>
    <ellipse cx="30" cy="35" rx="8" ry="14" fill="#fff" stroke="none" transform="rotate(-20,30,35)"/>
    <ellipse cx="30" cy="55" rx="8" ry="14" fill="#fff" stroke="none" transform="rotate(20,30,55)"/>
    <ellipse cx="30" cy="75" rx="8" ry="14" fill="#fff" stroke="none" transform="rotate(-20,30,75)"/>
    <ellipse cx="30" cy="95" rx="7" ry="12" fill="#fff" stroke="none" transform="rotate(20,30,95)"/>
  </g>
  <!-- Feed bag bottom -->
  <rect x="45" y="125" width="110" height="45" rx="8" fill="#fff" opacity="0.95"/>
  <text x="100" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#e65100">FEEDS</text>
</svg>
